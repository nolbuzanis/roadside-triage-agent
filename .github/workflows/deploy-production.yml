name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPOSITORY: roadside-agent
  IMAGE: roadside-agent
  SERVICE: roadside-agent

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            supabase:
              - 'supabase/migrations/**'

  migrate:
    needs: check-changes
    if: needs.check-changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Login to Supabase
        run: supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link to project
        run: supabase link --project-ref rfkqxcarsdgnlfugvhmy

      - name: Push migrations
        run: supabase db push --linked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    runs-on: ubuntu-latest
    needs: [check-changes, test]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push container
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --service-account ${{ vars.RUNTIME_SA }} \
            --set-secrets "SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_REALTIME_MODEL=OPENAI_REALTIME_MODEL:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest,DISPATCHER_ALERT_PHONE=DISPATCHER_ALERT_PHONE:latest,EMERGENCY_TRANSFER_PHONE=EMERGENCY_TRANSFER_PHONE:latest" \
            --timeout 300 \
            --concurrency 8 \
            --max-instances 10 \
            --min-instances 0

          echo "url=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format 'value(status.url)')" >> $GITHUB_OUTPUT

      - name: Verify deployment
        run: |
          sleep 10
          URL="${{ steps.deploy.outputs.url }}/health"
          echo "Checking health at: $URL"
          for i in 1 2 3 4 5; do
            if curl -sf "$URL"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Print deployment info
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          MEDIA_STREAM_HOST="$(echo "$DEPLOY_URL" | sed 's|https://||')"
          echo "=========================================="
          echo "  Production Deployment Complete"
          echo "=========================================="
          echo "  Service URL: $DEPLOY_URL"
          echo "  Health URL:  $DEPLOY_URL/health"
          echo "=========================================="
          echo ""
          echo "Configure Twilio webhooks:"
          echo "  Voice webhook: $DEPLOY_URL/api/v1/twilio/voice"
          echo "  Media Stream:  wss://${MEDIA_STREAM_HOST}/api/v1/twilio/media-stream"

      - name: Configure Supabase webhook URL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          WEBHOOK_URL="${{ steps.deploy.outputs.url }}/api/v1/webhooks/ticket-created"
          psql "$SUPABASE_DB_URL" \
            -c "ALTER DATABASE SET \"app.settings.webhook_url\" = '$WEBHOOK_URL';"
