name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPOSITORY: roadside-agent
  IMAGE: roadside-agent
  SERVICE: roadside-agent

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            supabase:
              - 'supabase/migrations/**'

  migrate:
    needs: check-changes
    if: needs.check-changes.outputs.supabase == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Login to Supabase
        run: supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link to project
        run: supabase link --project-ref rfkqxcarsdgnlfugvhmy

      - name: Push migrations
        run: supabase db push --linked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    runs-on: ubuntu-latest
    needs: [check-changes, test, migrate]
    # Run only after tests pass and any migration job has finished (or was
    # skipped because no migrations changed). This enforces
    # migration-before-code ordering for order-sensitive migrations.
    if: >-
      ${{ always() &&
          needs.check-changes.result == 'success' &&
          needs.test.result == 'success' &&
          (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify required configuration
        env:
          FRONTEND_ORIGINS: ${{ vars.FRONTEND_ORIGINS }}
        run: |
          if [ -z "${FRONTEND_ORIGINS}" ]; then
            echo "::error::Missing required repository variable: FRONTEND_ORIGINS (comma-separated browser origins, e.g. https://<project-id>.web.app,http://localhost:3000)"
            echo "Configure it under Settings -> Secrets and variables -> Actions -> Variables (README.md, 'GitHub Repository Configuration')."
            exit 1
          fi
          # Each entry must be a bare origin (scheme + host[:port]) and at least
          # one entry must survive: the backend matches the browser's Origin
          # header as an exact string, so a path, trailing slash, credentials, or
          # a blank value would silently reject every cross-origin preflight.
          python3 - <<'PY'
          import os
          import re
          import sys

          entries = [
              part.strip()
              for part in os.environ["FRONTEND_ORIGINS"].split(",")
              if part.strip()
          ]
          if not entries:
              print(
                  "::error::FRONTEND_ORIGINS must contain at least one origin, "
                  "got a blank or comma-only value"
              )
              sys.exit(1)

          errors = []
          for origin in entries:
              if origin.startswith("https://"):
                  rest = origin[len("https://"):]
              elif origin.startswith("http://"):
                  rest = origin[len("http://"):]
              else:
                  errors.append(f"{origin!r} must start with http:// or https://")
                  continue
              if not re.fullmatch(r"[A-Za-z0-9._\-:\[\]]+", rest):
                  errors.append(
                      f"{origin!r} must be scheme + host[:port] only — no path, "
                      "query, fragment, credentials, or whitespace"
                  )
          for error in errors:
              print(f"::error::Invalid FRONTEND_ORIGINS entry: {error}")
          sys.exit(1 if errors else 0)
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push container
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        env:
          FRONTEND_ORIGINS: ${{ vars.FRONTEND_ORIGINS }}
        run: |
          # FRONTEND_ORIGINS holds a comma-separated origin list, and gcloud
          # splits --set-env-vars on commas. The documented "^@^" prefix (gcloud
          # "Escape comma characters") switches the pair separator to "@" so the
          # commas inside the value stay literal. The value is passed through
          # step env rather than interpolated directly from a repository-variable
          # expression, so untrusted content can never reach the shell script.
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account ${{ vars.RUNTIME_SA }} \
            --set-secrets "SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_REALTIME_MODEL=OPENAI_REALTIME_MODEL:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest,DISPATCHER_ALERT_PHONE=DISPATCHER_ALERT_PHONE:latest,EMERGENCY_TRANSFER_PHONE=EMERGENCY_TRANSFER_PHONE:latest,DEMO_PHONE_HMAC_SECRET=DEMO_PHONE_HMAC_SECRET:latest" \
            --set-env-vars "^@^FRONTEND_ORIGINS=${FRONTEND_ORIGINS}" \
            --timeout 300 \
            --concurrency 8 \
            --max-instances 10 \
            --min-instances 0

          echo "url=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format 'value(status.url)')" >> $GITHUB_OUTPUT

      - name: Verify deployment
        run: |
          sleep 10
          URL="${{ steps.deploy.outputs.url }}/health"
          echo "Checking health at: $URL"
          for i in 1 2 3 4 5; do
            if curl -sf "$URL"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Print deployment info
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          MEDIA_STREAM_HOST="$(echo "$DEPLOY_URL" | sed 's|https://||')"
          echo "=========================================="
          echo "  Production Deployment Complete"
          echo "=========================================="
          echo "  Service URL: $DEPLOY_URL"
          echo "  Health URL:  $DEPLOY_URL/health"
          echo "=========================================="
          echo ""
          echo "Configure Twilio webhooks:"
          echo "  Voice webhook: $DEPLOY_URL/api/v1/twilio/voice"
          echo "  Media Stream:  wss://${MEDIA_STREAM_HOST}/api/v1/twilio/media-stream"
